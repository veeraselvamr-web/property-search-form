<!DOCTYPE html>
<html>
<head>
  <title>Property Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .search-container { max-width: 600px; margin: auto; text-align: center; }
    input, button { padding: 10px; width: 80%; margin: 5px 0; }
    button { width: auto; }
    .message { margin-top: 20px; padding: 10px; border-radius: 5px; }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="search-container">
    <h1>Property Search</h1>
    <form id="searchForm">
      <input type="text" id="query" placeholder="e.g. 3 BHK in Chennai under 80 Lakhs" required><br>
      <button type="submit">Search</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    document.getElementById("searchForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const query = document.getElementById("query").value;
      const messageDiv = document.getElementById("message");
      messageDiv.innerHTML = "";

      // Simple parsing logic
      let bedrooms = "";
      let locality = "";
      let budget = "";

      const bhkMatch = query.match(/(\d+)\s*BHK/i);
      if (bhkMatch) bedrooms = bhkMatch[1];

      const budgetMatch = query.match(/(\d+)\s*(Lakhs|L|Cr|Crore)/i);
      if (budgetMatch) budget = budgetMatch[0];

      const localityMatch = query.match(/in\s+([A-Za-z\s]+)/i);
      if (localityMatch) locality = localityMatch[1].trim();

      const data = {
        locality: locality,
        bedrooms: bedrooms,
        budget: budget,
        rawQuery: query,
        timestamp: new Date().toISOString()
      };

      try {
        const response = await fetch("http://localhost:5678/webhook-test/property-search", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data),
          mode: 'cors'
        });

        if (response.ok) {
          messageDiv.className = "message success";
          messageDiv.innerHTML = "✓ Search submitted successfully!";
          document.getElementById("query").value = "";
        } else {
          messageDiv.className = "message error";
          messageDiv.innerHTML = "✗ Error submitting search. Status: " + response.status;
        }
      } catch (err) {
        messageDiv.className = "message error";
        messageDiv.innerHTML = "✗ Connection error: " + err.message + "<br><br><small>Make sure N8N is running on http://localhost:5678</small>";
        console.error("Full error:", err);
      }
    });
  </script>
</body>
</html>
