<!DOCTYPE html>
<html>
<head>
  <title>Property Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .search-container { max-width: 600px; margin: auto; text-align: center; }
    input, button { padding: 10px; width: 80%; margin: 5px 0; }
    button { width: auto; cursor: pointer; }
    .message { margin-top: 20px; padding: 10px; border-radius: 5px; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
  </style>
</head>
<body>
  <div class="search-container">
    <h1>Property Search</h1>
    <form id="searchForm">
      <input type="text" id="query" placeholder="e.g. 3 BHK in Chennai under 80 Lakhs" required><br>
      <button type="submit">Search</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    document.getElementById("searchForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const query = document.getElementById("query").value;
      const messageDiv = document.getElementById("message");
      messageDiv.innerHTML = '<div class="message info">Submitting...</div>';

      // Simple parsing logic
      let bedrooms = "";
      let locality = "";
      let budget = "";

      const bhkMatch = query.match(/(\d+)\s*BHK/i);
      if (bhkMatch) bedrooms = bhkMatch[1];

      const budgetMatch = query.match(/(\d+)\s*(Lakhs|L|Cr|Crore)/i);
      if (budgetMatch) budget = budgetMatch[0];

      const localityMatch = query.match(/in\s+([A-Za-z\s]+)/i);
      if (localityMatch) locality = localityMatch[1].trim();

      const data = {
        locality: locality,
        bedrooms: bedrooms,
        budget: budget,
        rawQuery: query,
        timestamp: new Date().toISOString()
      };

      try {
        console.log("Sending data:", data);
        console.log("URL: http://localhost:5678/webhook-test/property-search");
        
        const response = await fetch("http://localhost:5678/webhook-test/property-search", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        console.log("Response status:", response.status);
        console.log("Response ok:", response.ok);

        const responseText = await response.text();
        console.log("Response:", responseText);

        if (response.ok) {
          messageDiv.innerHTML = '<div class="message success">✓ Search submitted successfully!</div>';
          document.getElementById("query").value = "";
        } else {
          messageDiv.innerHTML = '<div class="message error">✗ Server error: ' + response.status + '</div>';
        }
      } catch (err) {
        console.error("Error details:", err);
        messageDiv.innerHTML = '<div class="message error">✗ ' + err.message + '<br><br><small>Check browser console (F12) for details. Make sure N8N webhook is activated!</small></div>';
      }
    });
  </script>
</body>
</html>
